# The subroutine every account-bound flow starts with.
#
# ⚠️ CREDENTIALS COME FROM THE ENVIRONMENT AND ARE NEVER COMMITTED. MAESTRO_EMAIL and
# MAESTRO_PASSWORD belong to a throwaway account on a dev/staging backend, created by the
# developer running this. Nothing in this repository should ever contain a real one — see
# e2e/README.md for how to set them.
#
# The shelter flow calls this with DIFFERENT credentials, because the shelter shell is only
# reachable by a shelter account:
#
#     - runFlow:
#         file: 00-signin.yaml
#         env:
#           MAESTRO_EMAIL: ${MAESTRO_SHELTER_EMAIL}
#           MAESTRO_PASSWORD: ${MAESTRO_SHELTER_PASSWORD}
#
# which is why the landing assertion below is `screen.home` and NOT something owner-specific:
# a shelter account passes through `home` on its way to the shelter shell (HomeScreen reads
# /me and resets to shelterDashboard when account_type is "shelter"), so `home` is the one
# post-login state both kinds of account genuinely share.
appId: ph.kupkop.app
---
- launchApp:
    clearState: true          # a stale session would skip the whole point of this flow
- assertVisible:
    id: "screen.welcome"
# By id, not by the visible words. This flow used `text: "Log in"` and the welcome screen
# was redesigned the same week — exactly the copy-coupling the suite is meant to avoid.
- tapOn:
    id: "btn.welcome.login"
- assertVisible:
    id: "screen.signin"
- tapOn:
    id: "field.signin.email"
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: "field.signin.password"
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn:
    id: "btn.signin.submit"
# The assertion that matters: signing in lands on Home. A wrong password lands back on
# `screen.signin` with an error, and this fails there rather than three steps later.
- assertVisible:
    id: "screen.home"
    timeout: 20000
